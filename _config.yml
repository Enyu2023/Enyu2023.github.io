# Google Analytics
google-analytics: 

# Disqus
disqus-shortname: Ley

# Name of the Author
author-name: Enyu Li
# URL for the Image of the Author
author-image: /assets/images/enyu-li-portrait.jpg
# 60 Words About the Author
author-about: I'm a graduate student at Tsinghua University. I graduated from Beijing Normal University in 2024.
# URL to the Author's Profile (i.e., Github, Twitter, Stackoverflow, etc)
author-url: https://github.com/enyu2023

# SASS
sass:
  sass_dir: _sass
  style: compressed

# Build settings
plugins:
  - jekyll-admin
  - jekyll-feed

# Permalink
permalink: "blog/:categories/:title"

# Notes are independent of the existing blog posts.
collections:
  notes:
    output: true
    permalink: /notes/:name/

# Compress
compress_html:
  clippings: all


# Defaults
defaults:
  -
    scope:
      type: 'notes'
    values:
      layout: note
  -
    scope:
      type: 'posts'
    values:
      layout: post
      post-image: ""
      description: ""
      tags:
        - ""
  -
    scope:
      type: 'pages'
    values:
      layout: page

# Exclude
exclude:
  - .sass-cache/
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
