intro: >-
  In Galileo’s time, telescopes were rare and star-filled skies were commonplace.
  Four centuries later, the instruments are easy to find;
  [a truly dark sky is harder to come by](https://www.theatlantic.com/technology/archive/2013/07/let-there-be-night/278070/).
quote:
  text: "The sight of the stars always makes me dream."
  attribution: "Vincent van Gogh"
  source: "https://vangoghletters.org/vg/letters/let638/letter.html"
