quote:
  text: "400 years ago, … everyone could see the stars, but only Galileo had a telescope. Now, everybody has a telescope, but nobody can see the stars."
  attribution: "An astronomer in Florence, quoted by Paul Bogard"
  source: "https://www.theatlantic.com/technology/archive/2013/07/let-there-be-night/278070/"
