<!DOCTYPE html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title | escape }} · {% endif %}{{ site.title | escape }}</title>
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | replace: '/index.html', '/' | remove: '.html' | absolute_url | escape }}">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  <link rel="icon" href="{{ site.favicon-url | relative_url }}">
  <link rel="alternate" type="application/atom+xml" title="{{ site.title | escape }}" href="{{ '/feed.xml' | relative_url }}">
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({tex2jax: {inlineMath: [['$','$'], ['\\(','\\)']], displayMath: [['$$','$$'], ['\\[','\\]']], processEscapes: true}});
  </script>
  <script defer src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.9/MathJax.js?config=TeX-AMS-MML_HTMLorMML"></script>
</head>
<body class="academic">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="site-shell">
    <header class="site-header">
      <a class="site-name" href="{{ '/' | relative_url }}">{{ site.title | escape }}</a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}"{% if page.url == '/' %} aria-current="page"{% endif %}>Home</a>
        <a href="{{ '/#research' | relative_url }}">Research</a>
        <a href="{{ '/notes/' | relative_url }}"{% if page.url contains '/notes/' %} aria-current="{% if page.url == '/notes/' %}page{% else %}true{% endif %}"{% endif %}>Notes</a>
        <a href="{{ '/blog' | relative_url }}"{% if page.layout == 'blog' or page.layout == 'post' %} aria-current="{% if page.layout == 'blog' %}page{% else %}true{% endif %}"{% endif %}>Blog</a>
      </nav>
    </header>
    <main id="main-content">
      {{ content }}
    </main>
    <footer class="site-footer">
      <span>{{ site.title | escape }}</span>
      <nav aria-label="More links">
        <a href="{{ '/categories' | relative_url }}">Categories</a>
        <a href="{{ '/tags' | relative_url }}">Tags</a>
      </nav>
    </footer>
  </div>
</body>
</html>
