---
layout: academic
---
<header class="page-heading">
  <h1>Blog</h1>
  {% include search.html %}
</header>
<ul class="notes-list blog-list" id="blog-posts">
  {% for post in site.posts %}
  {% include blog-card.html %}
  {% endfor %}
</ul>
<p id="search-status" class="muted" role="status" hidden></p>
<script>
  (function () {
    var input = document.getElementById('search-input');
    var posts = Array.prototype.slice.call(document.querySelectorAll('#blog-posts > li'));
    var status = document.getElementById('search-status');
    input.addEventListener('input', function () {
      var query = input.value.trim().toLocaleLowerCase();
      var count = 0;
      posts.forEach(function (post) {
        var matches = !query || post.getAttribute('data-search').indexOf(query) !== -1;
        post.hidden = !matches;
        if (matches) count += 1;
      });
      status.hidden = !query;
      status.textContent = count === 0 ? 'No posts found.' : count + (count === 1 ? ' post found.' : ' posts found.');
    });
  })();
</script>
