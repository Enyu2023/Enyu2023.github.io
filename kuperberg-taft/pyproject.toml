[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kuperberg-taft"
version = "0.1.0"
description = "Exact Kuperberg state sums for odd Taft algebras on decorated Heegaard diagrams"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Codex"}]
dependencies = []

[project.scripts]
kuperberg-taft = "kuperberg_taft.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
